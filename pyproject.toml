[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "balatro-horizons"
version = "0.1.0"
description = "Local-first Balatro run trace and expert review workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
]

[project.scripts]
bh = "balatro_horizons.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
    "ruff>=0.16.7",
    "lupa>=2.8,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/balatro_horizons"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
