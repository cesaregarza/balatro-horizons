# The worker's public dependencies. Each download is checked by size and SHA256 before it
# is used. The apt packages are not pinned, so the worker records what it installed.
apt_packages = [
  "ca-certificates",
  "curl",
  "jq",
  "xz-utils",
  "zstd",
  "xvfb",
  "xauth",
  "mesa-utils",
  "libgl1-mesa-dri",
  "libgl1",
  "libglx-mesa0",
  "libvulkan1",
  "bubblewrap",
  "dbus-x11",
  "libasound2t64",
  "libpulse0",
  "fontconfig",
  "fonts-dejavu-core",
  "procps",
  "python3",
  "python3-venv",
  "python3-psutil",
  "rsync",
]

