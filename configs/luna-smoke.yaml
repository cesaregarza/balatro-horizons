# Native plumbing test; opt in with bh smoke --allow-paid.
# Standard and cache rates verified 2026-09-18 against the official Luna model page.
# Explicit prompt caching; no fast tier.
# Shared limits and disabled paid execution are inherited from config.py.
environment:
  stake: WHITE
budgets:
  max_episode_cost_usd: 1
  max_batch_cost_usd: 5
models:
  luna:
    provider: openai
    model: gpt-5.6-luna
    input_usd_per_million: 0.20
    cached_input_usd_per_million: 0.02
    cache_write_input_usd_per_million: 0.25
    output_usd_per_million: 1.20
    pricing_date: "2026-09-18"
    settings:
      reasoning_effort: medium
      reasoning_summary: auto
