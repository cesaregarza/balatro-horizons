# Opt-in single-model plumbing configuration; no paid execution by default.
# Standard short-context pricing verified 2026-09-22:
# https://developers.openai.com/api/docs/models/gpt-6-luna
# https://developers.openai.com/api/docs/pricing
environment:
  stake: WHITE
budgets:
  max_episode_cost_usd: 1
  max_batch_cost_usd: 5
models:
  luna6:
    provider: openai
    model: gpt-6-luna
    input_usd_per_million: 0.10
    cached_input_usd_per_million: 0.01
    cache_write_input_usd_per_million: 0.125
    output_usd_per_million: 0.50
    pricing_date: "2026-09-22"
    settings:
      reasoning_effort: medium
      reasoning_summary: auto
