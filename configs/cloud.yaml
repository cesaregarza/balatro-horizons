# Cloud runner settings (bh cloud). Prices are USD; check the size slug and its
# hourly price against DigitalOcean's size list before the first real run.
controller_id: horizons-main
region: nyc3
size: s-2vcpu-8gb-amd
image: ubuntu-24-04-x64
max_run_hours: 4
hourly_price_usd: 0.063
max_concurrent_workers: 1
infrastructure_budget_usd: 10
boot_timeout_seconds: 600
heartbeat_grace_seconds: 300
cleanup_verify_seconds: 600
retry_base_seconds: 2
retry_max_seconds: 60
poll_seconds: 15
